name: devflow-run-backend-token-calls
description: "Implementation of the devflow plan backend-token-calls (\"API-token calls to page backends, token-call stats and /data export/import\") from run d7e60cc8-7e05-444b-945b-d9075a87b008.\nThe plan is plans/backend-token-calls/plan.md on the plans branch.\nPhases run up to 3 at a time in their own worktrees, then tkcs-lab/devflow:devflow-deliver reviews, opens the PR and watches it."
worktree:
  enabled: true
returns: result
outcome_field: merged
nodes:
  - id: after-steps
    bash: "printf '%s' '' | base64 -d > \"$ARTIFACTS_DIR/after.md\"\necho \"after.md written\"\n"
  - id: start
    bash: "set -euo pipefail\nB='feat/backend-token-calls'; M='main'; PR='plans'\ngit fetch origin \"$M\"\ngit fetch origin \"$PR\"\nPC=$(git rev-parse FETCH_HEAD)\nif git ls-remote --exit-code --heads origin \"$B\" >/dev/null 2>&1; then\n  git fetch origin \"$B\"\n  if git rev-parse --verify --quiet \"refs/heads/$B\" >/dev/null; then git switch \"$B\"; git merge --ff-only \"origin/$B\"; else git switch -c \"$B\" --track \"origin/$B\"; fi\nelif git rev-parse --verify --quiet \"refs/heads/$B\" >/dev/null; then git switch \"$B\"\nelse git switch -c \"$B\" \"origin/$M\"; fi\nprintf '{\"head\":\"%s\",\"plan_commit\":\"%s\"}\\n' \"$(git rev-parse HEAD)\" \"$PC\"\n"
  - id: phase-p1-db-token-calls
    workflow: tkcs-lab/devflow:devflow-phase
    isolation: worktree
    depends_on:
      - start
    with:
      plan_ref: plans
      plan_path: plans/backend-token-calls/plan.md
      plan_commit: $start.output.plan_commit
      phase: p1-db-token-calls
      base: $start.output.head
  - id: phase-p2-backends-data-io
    workflow: tkcs-lab/devflow:devflow-phase
    isolation: worktree
    depends_on:
      - start
    with:
      plan_ref: plans
      plan_path: plans/backend-token-calls/plan.md
      plan_commit: $start.output.plan_commit
      phase: p2-backends-data-io
      base: $start.output.head
  - id: phase-p6-cli-token-calls
    workflow: tkcs-lab/devflow:devflow-phase
    isolation: worktree
    depends_on:
      - start
    with:
      plan_ref: plans
      plan_path: plans/backend-token-calls/plan.md
      plan_commit: $start.output.plan_commit
      phase: p6-cli-token-calls
      base: $start.output.head
  - id: merge-1
    depends_on:
      - phase-p1-db-token-calls
      - phase-p2-backends-data-io
      - phase-p6-cli-token-calls
    bash: "set -euo pipefail\nh1=$phase-p1-db-token-calls.output.head\nif git merge-base --is-ancestor \"$h1\" HEAD; then echo \"p1-db-token-calls already merged\" >&2\nelse git merge --no-ff \"$h1\" -m 'Merge backend-token-calls p1-db-token-calls: Migration 18 and store functions for the token-call opt-in and counters' -m 'Plan-Phase: backend-token-calls/p1-db-token-calls' || { git merge --abort; echo \"devflow: merging p1-db-token-calls conflicts; its touches overlap another phase\" >&2; exit 1; }\nfi\nh2=$phase-p2-backends-data-io.output.head\nif git merge-base --is-ancestor \"$h2\" HEAD; then echo \"p2-backends-data-io already merged\" >&2\nelse git merge --no-ff \"$h2\" -m 'Merge backend-token-calls p2-backends-data-io: Runtime archive methods, Manager ExportData/ImportData with the busy guard, and the fake' -m 'Plan-Phase: backend-token-calls/p2-backends-data-io' || { git merge --abort; echo \"devflow: merging p2-backends-data-io conflicts; its touches overlap another phase\" >&2; exit 1; }\nfi\nh3=$phase-p6-cli-token-calls.output.head\nif git merge-base --is-ancestor \"$h3\" HEAD; then echo \"p6-cli-token-calls already merged\" >&2\nelse git merge --no-ff \"$h3\" -m 'Merge backend-token-calls p6-cli-token-calls: CLI backend call, token-calls on/off, --allow-token-calls, show state and stats section' -m 'Plan-Phase: backend-token-calls/p6-cli-token-calls' || { git merge --abort; echo \"devflow: merging p6-cli-token-calls conflicts; its touches overlap another phase\" >&2; exit 1; }\nfi\nprintf '{\"head\":\"%s\"}\\n' \"$(git rev-parse HEAD)\"\n"
  - id: phase-p3-server-token-route
    workflow: tkcs-lab/devflow:devflow-phase
    isolation: worktree
    depends_on:
      - merge-1
    with:
      plan_ref: plans
      plan_path: plans/backend-token-calls/plan.md
      plan_commit: $start.output.plan_commit
      phase: p3-server-token-route
      base: $merge-1.output.head
  - id: phase-p7-cli-data
    workflow: tkcs-lab/devflow:devflow-phase
    isolation: worktree
    depends_on:
      - merge-1
    with:
      plan_ref: plans
      plan_path: plans/backend-token-calls/plan.md
      plan_commit: $start.output.plan_commit
      phase: p7-cli-data
      base: $merge-1.output.head
  - id: merge-2
    depends_on:
      - phase-p3-server-token-route
      - phase-p7-cli-data
    bash: "set -euo pipefail\nh1=$phase-p3-server-token-route.output.head\nif git merge-base --is-ancestor \"$h1\" HEAD; then echo \"p3-server-token-route already merged\" >&2\nelse git merge --no-ff \"$h1\" -m 'Merge backend-token-calls p3-server-token-route: Shared relay core, the API-token backend route and the opt-in API' -m 'Plan-Phase: backend-token-calls/p3-server-token-route' || { git merge --abort; echo \"devflow: merging p3-server-token-route conflicts; its touches overlap another phase\" >&2; exit 1; }\nfi\nh2=$phase-p7-cli-data.output.head\nif git merge-base --is-ancestor \"$h2\" HEAD; then echo \"p7-cli-data already merged\" >&2\nelse git merge --no-ff \"$h2\" -m 'Merge backend-token-calls p7-cli-data: CLI backend data export and import' -m 'Plan-Phase: backend-token-calls/p7-cli-data' || { git merge --abort; echo \"devflow: merging p7-cli-data conflicts; its touches overlap another phase\" >&2; exit 1; }\nfi\nprintf '{\"head\":\"%s\"}\\n' \"$(git rev-parse HEAD)\"\n"
  - id: phase-p4-server-data-routes
    workflow: tkcs-lab/devflow:devflow-phase
    isolation: worktree
    depends_on:
      - merge-2
    with:
      plan_ref: plans
      plan_path: plans/backend-token-calls/plan.md
      plan_commit: $start.output.plan_commit
      phase: p4-server-data-routes
      base: $merge-2.output.head
  - id: phase-p5-server-stats-token-calls
    workflow: tkcs-lab/devflow:devflow-phase
    isolation: worktree
    depends_on:
      - merge-2
    with:
      plan_ref: plans
      plan_path: plans/backend-token-calls/plan.md
      plan_commit: $start.output.plan_commit
      phase: p5-server-stats-token-calls
      base: $merge-2.output.head
  - id: merge-3
    depends_on:
      - phase-p4-server-data-routes
      - phase-p5-server-stats-token-calls
    bash: "set -euo pipefail\nh1=$phase-p4-server-data-routes.output.head\nif git merge-base --is-ancestor \"$h1\" HEAD; then echo \"p4-server-data-routes already merged\" >&2\nelse git merge --no-ff \"$h1\" -m 'Merge backend-token-calls p4-server-data-routes: Server /data export and import routes, the max_backend_data_import setting, and 503 while busy' -m 'Plan-Phase: backend-token-calls/p4-server-data-routes' || { git merge --abort; echo \"devflow: merging p4-server-data-routes conflicts; its touches overlap another phase\" >&2; exit 1; }\nfi\nh2=$phase-p5-server-stats-token-calls.output.head\nif git merge-base --is-ancestor \"$h2\" HEAD; then echo \"p5-server-stats-token-calls already merged\" >&2\nelse git merge --no-ff \"$h2\" -m 'Merge backend-token-calls p5-server-stats-token-calls: Token-call counters in the stats API' -m 'Plan-Phase: backend-token-calls/p5-server-stats-token-calls' || { git merge --abort; echo \"devflow: merging p5-server-stats-token-calls conflicts; its touches overlap another phase\" >&2; exit 1; }\nfi\nprintf '{\"head\":\"%s\"}\\n' \"$(git rev-parse HEAD)\"\n"
  - id: phase-p8-docs-retire
    workflow: tkcs-lab/devflow:devflow-phase
    isolation: worktree
    depends_on:
      - merge-3
    with:
      plan_ref: plans
      plan_path: plans/backend-token-calls/plan.md
      plan_commit: $start.output.plan_commit
      phase: p8-docs-retire
      base: $merge-3.output.head
  - id: merge-4
    depends_on:
      - phase-p8-docs-retire
    bash: "set -euo pipefail\nh1=$phase-p8-docs-retire.output.head\nif git merge-base --is-ancestor \"$h1\" HEAD; then echo \"p8-docs-retire already merged\" >&2\nelse git merge --no-ff \"$h1\" -m 'Merge backend-token-calls p8-docs-retire: Reference and operations docs, README, skill, example README, changelog' -m 'Plan-Phase: backend-token-calls/p8-docs-retire' || { git merge --abort; echo \"devflow: merging p8-docs-retire conflicts; its touches overlap another phase\" >&2; exit 1; }\nfi\nprintf '{\"head\":\"%s\"}\\n' \"$(git rev-parse HEAD)\"\n"
  - id: deliver
    workflow: tkcs-lab/devflow:devflow-deliver
    depends_on:
      - merge-4
      - after-steps
    with:
      plan_ref: plans
      plan_path: plans/backend-token-calls/plan.md
      plan_commit: $start.output.plan_commit
      slug: backend-token-calls
      branch: feat/backend-token-calls
      title: "API-token calls to page backends, token-call stats and /data export/import"
      head: $merge-4.output.head
  - id: result
    depends_on:
      - deliver
    bash: "m=$deliver.output.merged; printf '{\"merged\":%s}\\n' \"$m\"\n"
    output_format:
      type: object
      properties:
        merged:
          type: boolean
      required:
        - merged